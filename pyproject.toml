[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "claim-auditor"
version = "0.1.0"
description = "Snapshot-bound static evidence for bounded Python README claims"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic==2.14.1",
    "markdown-it-py==4.2.0",
]

[project.scripts]
claim-auditor = "claim_auditor.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/claim_auditor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "build==1.6.1",
    "editables==0.6",
    "hatchling==1.32.4",
    "pyyaml==6.0.3",
]
