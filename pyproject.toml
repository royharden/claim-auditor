[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "claim-auditor"
version = "0.1.0"
description = "Snapshot-bound static evidence for bounded Python README claims"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.8,<3", "markdown-it-py>=3,<5"]

[project.scripts]
claim-auditor = "claim_auditor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_auditor"]

[tool.ruff]
target-version = "py312"
line-length = 100
