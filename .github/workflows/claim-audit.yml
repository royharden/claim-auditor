            --trigger-revision "$TRIGGER_REVISION" --trigger-kind "$TRIGGER_KIND" \
            --repository "$REPOSITORY" --run-id "$ACTION_RUN_ID" \
            --target-repo "$RUNNER_TEMP/ca10-target" --target-sha "$TARGET_SHA" \
            --out "$RUNNER_TEMP/ca10-fixture"
      - name: Upload only complete selected report and frozen evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claim-audit-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ca10-fixture/artifact/
          if-no-files-found: error
